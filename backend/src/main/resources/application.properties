spring.application.name=AeroNexa
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/aeronnexa?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_DB_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Razorpay TEST credentials
razorpay.key.id=YOUR_RAZORPAY_TEST_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_TEST_KEY_SECRET 