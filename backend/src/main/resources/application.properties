spring.application.name=AeroNexa
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aeronnexa?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Razorpay TEST credentials
razorpay.key.id=YOUR_RAZORPAY_TEST_KEY_ID
razorpay.key.secret=YOUR_RAZORPAY_TEST_KEY_SECRET 